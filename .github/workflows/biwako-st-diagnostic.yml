name: Biwako ST and Start Ranking Diagnostic

on:
  workflow_dispatch:
    inputs:
      race:
        description: 'Race number (1-12)'
        required: true
        default: '3'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect official Biwako page for current-series ST and start ranking
        env:
          RACE: ${{ inputs.race }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.request
          from html.parser import HTMLParser
          from datetime import datetime, timezone, timedelta

          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.tables=[]; self.table_depth=0; self.rows=None; self.row=None; self.cell=None
                  self.text=[]; self.skip=0
              def handle_starttag(self,tag,attrs):
                  if tag in ('script','style'): self.skip+=1
                  if tag=='table':
                      if self.table_depth==0: self.rows=[]
                      self.table_depth+=1
                  elif tag=='tr' and self.table_depth==1: self.row=[]
                  elif tag in ('td','th') and self.table_depth==1 and self.row is not None: self.cell=[]
              def handle_data(self,data):
                  if self.cell is not None: self.cell.append(data)
                  if not self.skip and data.strip(): self.text.append(' '.join(data.split()))
              def handle_endtag(self,tag):
                  if tag in ('script','style') and self.skip: self.skip-=1
                  if tag in ('td','th') and self.cell is not None and self.row is not None:
                      self.row.append(' '.join(''.join(self.cell).split())); self.cell=None
                  elif tag=='tr' and self.row is not None and self.table_depth==1:
                      self.rows.append(self.row); self.row=None
                  elif tag=='table' and self.table_depth:
                      self.table_depth-=1
                      if self.table_depth==0:
                          self.tables.append(self.rows); self.rows=None

          race=int(os.environ['RACE'])
          if race not in range(1,13): raise ValueError('race must be 1..12')
          url=f'https://www.boatrace-biwako.jp/sp/index.php?page=yosou-cyokuzen&race={race}'
          request=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(request,timeout=25) as response:
              raw=response.read(); charset=response.headers.get_content_charset() or 'utf-8'
          html=raw.decode(charset,errors='replace')
          p=Page(); p.feed(html)
          print('Fetched JST:',datetime.now(timezone(timedelta(hours=9))).isoformat())
          print('Source:',url, 'HTML bytes:',len(raw), 'tables:',len(p.tables))
          print('\nST / START / SERIES KEYWORD CONTEXT (visible text):')
          terms=('今節','平均ST','スタート','ST','進入','節間')
          indexes=[i for i,s in enumerate(p.text) if any(t.lower() in s.lower() for t in terms)]
          for i in indexes[:45]:
              print('TEXT',i,repr(p.text[max(0,i-3):i+7]))
          print('\nALL TABLES (max 22 rows per table):')
          for i,table in enumerate(p.tables):
              print('TABLE',i,'rowcount',len(table))
              for row in table[:22]: print('ROW',repr(row))
          print('\nMATCHING HTML FRAGMENTS:')
          for pattern in [r'今節',r'平均\s*ST',r'スタート順',r'スタート順位']:
              matches=list(re.finditer(pattern,html,re.I))
              print('pattern',repr(pattern),'count',len(matches))
              for m in matches[:3]:
                  print('HTML',re.sub(r'\s+',' ',html[max(0,m.start()-200):m.end()+400])[:600])
          print('\nDIAGNOSTIC ONLY: no JSON created, no app files changed.')
          PY
