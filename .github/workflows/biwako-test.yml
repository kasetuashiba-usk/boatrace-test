name: Biwako Official Data Test

on:
  workflow_dispatch:
    inputs:
      race:
        description: 'Race number (1-12)'
        required: true
        default: '3'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and inspect Biwako exhibition and date clues
        env:
          RACE: ${{ inputs.race }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.request
          from html.parser import HTMLParser
          from datetime import datetime, timezone, timedelta

          JST = timezone(timedelta(hours=9))
          class Tables(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tables=[]; self.stack=[]; self.row=None; self.cell=None
                  self.visible=[]; self.capture_title=False; self.title=[]
                  self.links=[]; self.meta=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='title': self.capture_title=True
                  if tag=='a' and a.get('href'): self.links.append(a['href'])
                  if tag=='meta': self.meta.append(a)
                  if tag=='table': self.stack.append([])
                  elif self.stack and tag=='tr': self.row=[]
                  elif self.stack and tag in ('td','th') and self.row is not None: self.cell=[]
              def handle_data(self,data):
                  s=' '.join(data.split())
                  if s: self.visible.append(s)
                  if self.capture_title: self.title.append(data)
                  if self.cell is not None: self.cell.append(data)
              def handle_endtag(self,tag):
                  if tag=='title': self.capture_title=False
                  if tag in ('td','th') and self.cell is not None and self.row is not None:
                      self.row.append(' '.join(''.join(self.cell).split())); self.cell=None
                  elif tag=='tr' and self.row is not None and self.stack:
                      self.stack[-1].append(self.row); self.row=None
                  elif tag=='table' and self.stack:
                      self.tables.append(self.stack.pop())

          race=int(os.environ['RACE'])
          if not 1<=race<=12: raise ValueError('race must be 1..12')
          url=f'https://www.boatrace-biwako.jp/sp/index.php?page=yosou-cyokuzen&race={race}'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; BoatraceResearch/1.0)'})
          with urllib.request.urlopen(req,timeout=25) as resp:
              raw=resp.read(); charset=resp.headers.get_content_charset() or 'utf-8'
          html=raw.decode(charset,errors='replace')
          p=Tables();p.feed(html)
          now=datetime.now(JST)
          print('JST fetched:',now.isoformat())
          print('Source:',url)
          print('HTML bytes:',len(raw),'tables:',len(p.tables))
          print('Page title:', ''.join(p.title).strip())
          print('First 45 visible text fragments:', repr(p.visible[:45]))
          dateish=re.compile(r'20\d{2}[/.-]\d{1,2}[/.-]\d{1,2}|\d{1,2}月\d{1,2}日|\d{1,2}/\d{1,2}|target_day|resultday|kaisai|schedule|date',re.I)
          print('Date-related visible fragments:',repr([x for x in p.visible if dateish.search(x)][:35]))
          print('Date-related links:',repr([x for x in p.links if dateish.search(x)][:35]))
          print('Relevant meta:',repr([x for x in p.meta if dateish.search(str(x))][:15]))
          print('HTML date token contexts:')
          for m in list(dateish.finditer(html))[:20]:
              snippet=re.sub(r'\s+',' ',html[max(0,m.start()-80):min(len(html),m.end()+80)])
              print(' ',repr(snippet))

          candidates=[]
          for table in p.tables:
              heading=' '.join(' '.join(row) for row in table[:5])
              if all(k in heading for k in ('一周','まわり足','直線')): candidates.append(table)
          if not candidates: raise RuntimeError('Original-exhibition table not found')
          table=candidates[-1]
          print('Candidate table row count:',len(table))
          valid={}
          for row in table:
              if not row or row[0] not in [str(i) for i in range(1,7)]: continue
              if len(row)<7: continue
              try:
                  # Fixed columns, not loose matching of decimals
                  weight,tilt,exhibition,lap,turn,straight=map(float,row[1:7])
              except ValueError:
                  continue
              if not (40<=weight<=80 and -1<=tilt<=3 and 5<=exhibition<=9 and
                      25<=lap<=50 and 3<=turn<=8 and 6<=straight<=11): continue
              valid[int(row[0])] = row[:7]
          print('boat | weight | tilt | exhibition | lap | turn | straight')
          for boat in sorted(valid): print(' | '.join(valid[boat]))
          if len(valid)!=6: raise RuntimeError(f'Only {len(valid)}/6 valid exhibition rows. No JSON saved.')
          print('PASS: 6/6 exhibition rows parsed.')
          print('HOLD: Race date is not verified against exhibition data. No JSON saved.')
          print('TEST ONLY: no app data overwritten or committed.')
          PY
