name: Biwako ST Parse Test

on:
  workflow_dispatch:
    inputs:
      race:
        description: 'Race number (1-12)'
        required: true
        default: '3'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Parse series ST and start order
        env:
          RACE: ${{ inputs.race }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          from datetime import datetime, timezone, timedelta
          from html.parser import HTMLParser
          from pathlib import Path

          JST = timezone(timedelta(hours=9))
          class Tables(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tables=[]; self.stack=[]; self.row=None; self.cell=None
              def handle_starttag(self, tag, attrs):
                  if tag == 'table': self.stack.append([])
                  elif self.stack and tag == 'tr': self.row=[]
                  elif self.stack and tag in ('td','th') and self.row is not None: self.cell=[]
              def handle_data(self, data):
                  if self.cell is not None: self.cell.append(data)
              def handle_endtag(self, tag):
                  if tag in ('td','th') and self.cell is not None and self.row is not None:
                      self.row.append(' '.join(''.join(self.cell).split())); self.cell=None
                  elif tag == 'tr' and self.row is not None and self.stack:
                      self.stack[-1].append(self.row); self.row=None
                  elif tag == 'table' and self.stack:
                      self.tables.append(self.stack.pop())

          race=int(os.environ['RACE'])
          if race not in range(1,13): raise ValueError('race must be 1..12')
          url=f'https://www.boatrace-biwako.jp/sp/index.php?page=yosou-cyokuzen&race={race}'
          request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(request,timeout=25) as response:
              raw=response.read(); encoding=response.headers.get_content_charset() or 'utf-8'
          html=raw.decode(encoding,errors='replace')
          parser=Tables(); parser.feed(html)
          candidates=[t for t in parser.tables if any('今節平均ST' in ''.join(r) for r in t[:3])
                      and any('スタート順' in ''.join(r) for r in t[:3])]
          if len(candidates)!=1: raise RuntimeError(f'Expected one ST table; got {len(candidates)}')
          table=candidates[0]
          boats=[]
          for i,row in enumerate(table):
              if len(row)<3 or row[0] not in [str(n) for n in range(1,7)] or row[1] != row[0]:
                  continue
              boat=int(row[0])
              if i+1>=len(table): raise RuntimeError(f'Boat {boat}: missing start-order row')
              next_row=table[i+1]
              # The site's current table has a separate row for start order.
              if len(next_row)!=1: raise RuntimeError(f'Boat {boat}: unexpected start-order row {next_row!r}')
              avg_st=row[2]
              if not re.fullmatch(r'\.\d{2}',avg_st): raise RuntimeError(f'Boat {boat}: invalid series ST {avg_st!r}')
              if not re.fullmatch(r'\d+(?:\.\d+)?',next_row[0]):
                  raise RuntimeError(f'Boat {boat}: invalid start order {next_row[0]!r}')
              exhibition_st=row[-1]
              if not re.fullmatch(r'(?:F|L)?\.\d{2}',exhibition_st):
                  raise RuntimeError(f'Boat {boat}: invalid exhibition ST {exhibition_st!r}')
              boats.append({'boat':boat,'series_avg_st':float(avg_st),
                            'series_avg_start_order':float(next_row[0]),
                            'exhibition_st_raw':exhibition_st})
          if len(boats)!=6 or sorted(b['boat'] for b in boats)!=list(range(1,7)):
              raise RuntimeError('Not all 6 boats parsed; no JSON generated')
          now=datetime.now(JST)
          output={'venue':'biwako','race':race,'date_jst':now.date().isoformat(),
                  'fetched_at_jst':now.isoformat(),'source_url':url,
                  'date_verification':'UNVERIFIED_FROM_RECORD',
                  'production_approved':False,'boats':boats}
          Path('test-output').mkdir(exist_ok=True)
          path=Path('test-output') / f'biwako-st-{now:%Y%m%d}-{race:02d}R-provisional.json'
          path.write_text(json.dumps(output,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('PASS: 6 boats series ST/start order/exhibition ST parsed')
          for b in boats: print('BOAT',b)
          print('PROVISIONAL JSON:',path)
          print('DO NOT USE IN PRODUCTION: race-date binding not verified')
          PY
      - name: Upload provisional ST JSON
        uses: actions/upload-artifact@v4
        with:
          name: biwako-st-provisional
          path: test-output/*.json
          if-no-files-found: error
