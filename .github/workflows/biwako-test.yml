name: Biwako Official Data Test

on:
  workflow_dispatch:
    inputs:
      race:
        description: 'Race number (1-12)'
        required: true
        default: '3'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Biwako race-date binding (read only)
        env:
          RACE: ${{ inputs.race }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.request
          from html.parser import HTMLParser
          from datetime import datetime, timezone, timedelta
          from urllib.parse import urljoin

          class Inspector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tables=[]; self.stack=[]; self.row=None; self.cell=None
                  self.links=[]; self.current_link=None
                  self.forms=[]; self.in_form=False
                  self.fields=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='table': self.stack.append([])
                  elif self.stack and tag=='tr': self.row=[]
                  elif self.stack and tag in ('td','th') and self.row is not None: self.cell=[]
                  if tag=='a': self.current_link=[a.get('href',''),[]]
                  if tag=='form':
                      self.in_form=True; self.forms.append({'action':a.get('action',''), 'method':a.get('method','GET')})
                  if tag in ('input','select','option'):
                      if self.in_form or any(k in str(a).lower() for k in ('date','race','day','hid','kaisai')):
                          self.fields.append((tag,{k:v for k,v in a.items() if k in ('name','value','id','selected','type')}))
              def handle_data(self, data):
                  if self.cell is not None: self.cell.append(data)
                  if self.current_link is not None: self.current_link[1].append(data)
              def handle_endtag(self, tag):
                  if tag in ('td','th') and self.cell is not None and self.row is not None:
                      self.row.append(' '.join(''.join(self.cell).split())); self.cell=None
                  elif tag=='tr' and self.row is not None and self.stack:
                      self.stack[-1].append(self.row); self.row=None
                  elif tag=='table' and self.stack:
                      self.tables.append(self.stack.pop())
                  if tag=='a' and self.current_link is not None:
                      self.links.append((self.current_link[0],''.join(self.current_link[1]).strip()))
                      self.current_link=None
                  if tag=='form': self.in_form=False

          race=int(os.environ['RACE'])
          if not 1 <= race <= 12: raise ValueError('race must be 1..12')
          url=f'https://www.boatrace-biwako.jp/sp/index.php?page=yosou-cyokuzen&race={race}'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=25) as response:
              raw=response.read()
              encoding=response.headers.get_content_charset() or 'utf-8'
          html=raw.decode(encoding,errors='replace')
          p=Inspector();p.feed(html)
          now=datetime.now(timezone(timedelta(hours=9)))
          print('Fetched JST:',now.isoformat(),'requested race:',race)
          print('Source:',url,'HTML bytes:',len(raw))
          print('Forms:',p.forms[:15])
          print('Form/date/race fields:',p.fields[:40])
          print('Race/date-relevant links:')
          matched=[(h,t) for h,t in p.links if re.search(r'(race=|rno=|date=|day=|hid=|直前情報|出走表|結果)',h+' '+t,re.I)]
          for href,txt in matched[:45]: print('LINK:',repr(txt[:40]),repr(href[:180]))
          print('Potential date/race attributes:')
          for m in list(re.finditer(r'(?:race|date|day|ymd|hid|kaisai)[^\n<>]{0,110}',html,re.I))[:35]:
              print('HTML:',re.sub(r'\s+',' ',m.group(0))[:135])

          tables=[t for t in p.tables if all(x in ' '.join(' '.join(r) for r in t[:5]) for x in ('一周','まわり足','直線'))]
          if not tables: raise RuntimeError('Exhibition table not found')
          valid={}
          for row in tables[-1]:
              if row and row[0] in tuple(map(str,range(1,7))):
                  if len(row)>=7 and all(re.fullmatch(r'\d{1,2}\.\d{1,2}',x) for x in row[1:7]):
                      valid[int(row[0])]=row
          for boat,row in sorted(valid.items()): print('BOAT:',boat,'VALUES:',row[1:7])
          if len(valid)!=6: raise RuntimeError(f'Only {len(valid)}/6 boats validated')
          print('PASS: 6/6 exhibition rows read.')
          print('HOLD: displayed schedule date is not sufficient to prove record date. No JSON saved.')
          PY
