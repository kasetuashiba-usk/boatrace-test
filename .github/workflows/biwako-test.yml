name: Biwako Official Data Test

on:
  workflow_dispatch:
    inputs:
      race:
        description: 'Race number (1-12)'
        required: true
        default: '7'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and validate Biwako original exhibition
        env:
          RACE: ${{ inputs.race }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.request
          from html.parser import HTMLParser
          from datetime import datetime, timezone, timedelta

          class Tables(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tables=[]; self.stack=[]; self.row=None; self.cell=None
              def handle_starttag(self,tag,attrs):
                  if tag=='table':
                      self.stack.append([])
                  elif self.stack and tag=='tr':
                      self.row=[]
                  elif self.stack and tag in ('td','th') and self.row is not None:
                      self.cell=[]
              def handle_data(self,data):
                  if self.cell is not None:
                      self.cell.append(data)
              def handle_endtag(self,tag):
                  if tag in ('td','th') and self.cell is not None and self.row is not None:
                      self.row.append(' '.join(''.join(self.cell).split()))
                      self.cell=None
                  elif tag=='tr' and self.row is not None and self.stack:
                      self.stack[-1].append(self.row)
                      self.row=None
                  elif tag=='table' and self.stack:
                      rows=self.stack.pop()
                      self.tables.append(rows)

          race=int(os.environ['RACE'])
          if not 1 <= race <= 12:
              raise ValueError('race must be 1..12')
          url=f'https://www.boatrace-biwako.jp/sp/index.php?page=yosou-cyokuzen&race={race}'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; BoatraceResearch/1.0)'})
          with urllib.request.urlopen(req,timeout=25) as resp:
              raw=resp.read()
              charset=resp.headers.get_content_charset() or 'utf-8'
          html=raw.decode(charset,errors='replace')
          p=Tables();p.feed(html)
          print('JST fetched:',datetime.now(timezone(timedelta(hours=9))).isoformat())
          print('Source:',url)
          print('HTML bytes:',len(raw),'tables:',len(p.tables))

          # Identify the original-exhibition table by its labels, not by a fixed table index.
          def norm(s):return re.sub(r'\s+','',s)
          candidates=[]
          for table in p.tables:
              heading=' '.join(' '.join(row) for row in table[:5])
              if '一周' in heading and 'まわり足' in heading and '直線' in heading:
                  candidates.append(table)
          if not candidates:
              raise RuntimeError('Original-exhibition table not found; page structure may have changed')
          table=candidates[-1]
          print('Candidate table row count:',len(table))
          for row in table[:12]:print('ROW:',repr(row))
          # Data quality check. Do not write JSON until six real boats are confirmed.
          valid={}
          for row in table:
              if not row or row[0] not in [str(i) for i in range(1,7)]:continue
              nums=[x for x in row[1:] if re.fullmatch(r'\d{1,2}\.\d{1,2}',x)]
              if len(nums)>=5:valid[int(row[0])]=row
          if len(valid)!=6:
              raise RuntimeError(f'Only {len(valid)} / 6 boats have numeric original exhibition values. No JSON saved.')
          print('PASS: 6/6 original-exhibition rows detected. Parsing layout still needs manual verification.')
          print('TEST ONLY: no files committed, no app data overwritten.')
          PY
