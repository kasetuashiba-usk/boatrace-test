
name: Suminoe Fetch Test

on:
  workflow_dispatch:
    inputs:
      race:
        description: "Race number (1-12)"
        required: true
        default: "11"

permissions:
  contents: write
  
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Extract race data
        env:
          RACE: ${{ inputs.race }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.request
          from html.parser import HTMLParser
          from datetime import datetime, timezone, timedelta

          class Reader(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
              def handle_data(self, data):
                  value = " ".join(data.split())
                  if value:
                      self.parts.append(value)

          race = int(os.environ["RACE"])
          if not 1 <= race <= 12:
              raise ValueError("Race must be 1-12")

          url = (
              "https://www.boatrace-suminoe.jp/"
              f"asp/kyogi/12/sp/yoso05{race:02d}.htm"
          )
          req = urllib.request.Request(
              url, headers={"User-Agent": "Mozilla/5.0"}
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              html = response.read().decode("utf-8", errors="replace")

          parser = Reader()
          parser.feed(html)
          p = parser.parts

          now = datetime.now(timezone(timedelta(hours=9)))
          print("取得時刻（日本）:", now.strftime("%Y-%m-%d %H:%M:%S"))
          print("住之江", race, "R")
          print("取得URL:", url)

          def locate(headers):
              matches = []
              for i in range(len(p) - len(headers)):
                  if p[i:i+len(headers)] == headers:
                      matches.append(i + len(headers))
              return matches[-1] if matches else None

          start = locate([
              "枠", "選手名", "体重", "チルト",
              "展示", "一周", "まわり足", "調整"
          ])

          print("\n【展示データ】")
          print("艇 | 選手 | 体重 | チルト | 展示 | 一周 | まわり足")
          if start is None:
              print("展示表が見つかりません")
          else:
              rows = {}
              for i in range(start, min(start + 70, len(p))):
                  if p[i] in [str(n) for n in range(1, 7)]:
                      boat = int(p[i])
                      if boat not in rows and i + 6 < len(p):
                          values = p[i:i+7]
                          if len(values) == 7:
                              rows[boat] = values
              for boat in range(1, 7):
                  if boat in rows:
                      print(" | ".join(rows[boat]))
                  else:
                      print(f"{boat} | 未取得")
          st = locate([
              "枠", "選手名", "今節平均ST", "スタート順"
          ])

          print("\n【今節スタートデータ】")
          print("艇 | 選手 | 平均ST | 平均スタート順位")
          if st is None:
              print("スタート表が見つかりません")
          else:
              for i in range(6):
                  row = p[st + i*5:st + (i+1)*5]
                  if len(row) == 5 and row[0] == row[1] == str(i + 1):
                      print(" | ".join([row[0], row[2], row[3], row[4]]))
                  else:
                      print(f"{i + 1} | データ確認が必要")
          import json
          from pathlib import Path

          output = {
              "venue": "suminoe",
              "race": race,
              "fetched_at": now.isoformat(),
              "boats": []
          }

          for boat in range(1, 7):
              exhibition = rows.get(boat) if start is not None else None
              start_data = (
                  p[st + (boat-1)*5:st + boat*5]
                  if st is not None else []
              )

              item = {"boat": boat}

              if exhibition and len(exhibition) == 7:
                  item.update({
                      "name": exhibition[1],
                      "weight": exhibition[2],
                      "tilt": exhibition[3],
                      "exhibition": exhibition[4],
                      "lap": exhibition[5],
                      "turn": exhibition[6]
                  })

              if len(start_data) == 5 and start_data[0] == start_data[1] == str(boat):
                  item["average_st"] = start_data[3]
                  item["average_start_rank"] = start_data[4]

              output["boats"].append(item)

          path = Path(f"data/suminoe-{race:02d}.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              json.dumps(output, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          print("JSON作成:", path)
          PY
