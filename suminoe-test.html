<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>住之江公式データ取得テスト</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:24px auto;padding:0 16px;line-height:1.6}button{font-size:18px;padding:12px 20px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f4f6;padding:12px;border-radius:8px}</style><h2>住之江公式データ取得テスト</h2><p>GitHub Pagesに置いてから「取得テスト」を押してください。公式サイトを直接読み込めるか確認します。</p><label>レース <select id="race"></select></label> <button id="go">取得テスト</button><pre id="out">待機中</pre><script>const sel=document.getElementById('race');for(let i=1;i<=12;i++){let o=document.createElement('option');o.value=i;o.textContent=i+'R';sel.append(o)};document.getElementById('go').onclick=async()=>{const n=String(sel.value).padStart(2,'0');const url=`https://www.boatrace-suminoe.jp/asp/kyogi/12/sp/yoso05${n}.htm`;const out=document.getElementById('out');out.textContent='確認中…\n'+url;try{const response=await fetch(url,{cache:'no-store'});const body=await response.text();const doc=new DOMParser().parseFromString(body,'text/html');const content=doc.body?.innerText||doc.body?.textContent||'';out.textContent=`通信成功\nHTTP ${response.status}\n文字数 ${body.length}\n「オリジナル展示」: ${content.includes('オリジナル展示')?'あり':'なし'}\n「スタート展示」: ${content.includes('スタート展示')?'あり':'なし'}\n※通信成功だけでは、締切10分前に数値があることまでは確認できません。`;}catch(e){out.textContent=`直接取得できませんでした。\n${e.name}: ${e.message}\n\n考えられる原因：CORS制限、ネットワーク障害、サイト側のアクセス制限など。\n※この結果だけでは原因を断定できません。`}};</script></html>
