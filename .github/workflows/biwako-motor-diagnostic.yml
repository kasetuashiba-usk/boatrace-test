name: Biwako Motor Diagnostic

on:
  workflow_dispatch:
    inputs:
      race:
        description: 'Race number (1-12)'
        required: true
        default: '3'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect race entries and motor ranking page
        env:
          RACE: ${{ inputs.race }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.request
          from html.parser import HTMLParser
          from datetime import datetime, timezone, timedelta

          class Parse(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.tables=[]; self.stack=[]; self.row=None; self.cell=None
                  self.links=[]; self.href=None; self.linktext=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='table': self.stack.append([])
                  elif self.stack and tag=='tr': self.row=[]
                  elif self.stack and tag in ('td','th') and self.row is not None: self.cell=[]
                  if tag=='a': self.href=a.get('href'); self.linktext=[]
              def handle_data(self,data):
                  if self.cell is not None: self.cell.append(data)
                  if self.href is not None: self.linktext.append(data)
              def handle_endtag(self,tag):
                  if tag in ('td','th') and self.cell is not None and self.row is not None:
                      self.row.append(' '.join(''.join(self.cell).split())); self.cell=None
                  elif tag=='tr' and self.row is not None and self.stack:
                      self.stack[-1].append(self.row); self.row=None
                  elif tag=='table' and self.stack:
                      self.tables.append(self.stack.pop())
                  if tag=='a' and self.href is not None:
                      self.links.append((' '.join(''.join(self.linktext).split()),self.href))
                      self.href=None; self.linktext=[]

          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=25) as resp:
                  raw=resp.read(); charset=resp.headers.get_content_charset() or 'utf-8'
              html=raw.decode(charset, errors='replace')
              p=Parse(); p.feed(html)
              return raw,html,p

          race=int(os.environ['RACE'])
          if not 1 <= race <= 12: raise ValueError('Race must be 1..12')
          print('JST:',datetime.now(timezone(timedelta(hours=9))).isoformat())
          urls=[
              f'https://www.boatrace-biwako.jp/sp/index.php?page=yosou-syussou&race={race}',
              'https://www.boatrace-biwako.jp/sp/index.php?page=datafile-motorrank',
          ]
          for url in urls:
              print('\nURL:',url)
              try: raw,html,p=fetch(url)
              except Exception as e:
                  print('FETCH ERROR:',type(e).__name__,str(e)); continue
              print('HTML bytes:',len(raw),'tables:',len(p.tables))
              for i,table in enumerate(p.tables):
                  print('TABLE',i,'rows',len(table))
                  for row in table[:10]: print('ROW',repr(row)[:420])
              print('MOTOR-RELATED LINKS (first 20):')
              links=[(label,href) for label,href in p.links if 'モーター' in label or 'motor' in href.lower() or 'mrank' in href.lower()]
              for pair in links[:20]: print('LINK',repr(pair))
              for keyword in ('モーター', '2連対率', '２連対率', '勝率'):
                  print('KEYWORD',keyword,'count',html.count(keyword))
          print('\nDIAGNOSTIC ONLY: no JSON generated, no repository data changed.')
          PY
