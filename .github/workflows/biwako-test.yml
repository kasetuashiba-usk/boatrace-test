name: Biwako Official Data Test

on:
  workflow_dispatch:
    inputs:
      race:
        description: 'Race number (1-12)'
        required: true
        default: '7'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and validate Biwako original exhibition
        env:
          RACE: ${{ inputs.race }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.request
          from html.parser import HTMLParser
          from datetime import datetime, timezone, timedelta

          JST = timezone(timedelta(hours=9))

          class Tables(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tables = []
                  self.stack = []
                  self.row = None
                  self.cell = None
              def handle_starttag(self, tag, attrs):
                  if tag == 'table':
                      self.stack.append([])
                  elif self.stack and tag == 'tr':
                      self.row = []
                  elif self.stack and tag in ('td', 'th') and self.row is not None:
                      self.cell = []
              def handle_data(self, data):
                  if self.cell is not None:
                      self.cell.append(data)
              def handle_endtag(self, tag):
                  if tag in ('td', 'th') and self.cell is not None and self.row is not None:
                      self.row.append(' '.join(''.join(self.cell).split()))
                      self.cell = None
                  elif tag == 'tr' and self.row is not None and self.stack:
                      self.stack[-1].append(self.row)
                      self.row = None
                  elif tag == 'table' and self.stack:
                      self.tables.append(self.stack.pop())

          race = int(os.environ['RACE'])
          if not 1 <= race <= 12:
              raise ValueError('race must be 1..12')

          fetched_at = datetime.now(JST)
          url = f'https://www.boatrace-biwako.jp/sp/index.php?page=yosou-cyokuzen&race={race}'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (compatible; BoatraceResearch/1.0)'})
          with urllib.request.urlopen(req, timeout=25) as resp:
              raw = resp.read()
              charset = resp.headers.get_content_charset() or 'utf-8'
          html = raw.decode(charset, errors='replace')
          parser = Tables()
          parser.feed(html)
          print('JST fetched:', fetched_at.isoformat())
          print('Source:', url)
          print('HTML bytes:', len(raw), 'tables:', len(parser.tables))
          print('Requested race:', race)

          # This page URL has no date parameter. A successful fetch alone does not
          # prove that the page belongs to the intended meeting/date.
          date_patterns = [
              r'20\d{2}[/.-]\d{1,2}[/.-]\d{1,2}',
              r'20\d{2}年\s*\d{1,2}月\s*\d{1,2}日',
              r'\d{1,2}月\s*\d{1,2}日',
          ]
          visible_text = re.sub(r'<[^>]*>', ' ', html)
          visible_text = ' '.join(visible_text.split())
          date_hits = []
          for pattern in date_patterns:
              date_hits.extend(re.findall(pattern, visible_text)[:10])
          print('Page date candidates (unverified):', list(dict.fromkeys(date_hits))[:20])
          print('DATE STATUS: UNVERIFIED; no reliable race-day field mapped yet.')

          candidates = []
          for table in parser.tables:
              heading = ' '.join(' '.join(row) for row in table[:5])
              if '一周' in heading and 'まわり足' in heading and '直線' in heading:
                  candidates.append(table)
          if not candidates:
              raise RuntimeError('Original-exhibition table not found; page structure may have changed')
          if len(candidates) != 1:
              raise RuntimeError(f'Expected one exhibition table, found {len(candidates)}; no JSON saved.')
          table = candidates[0]
          print('Candidate table row count:', len(table))
          for row in table:
              print('ROW:', repr(row))

          valid = {}
          for row in table:
              if len(row) != 7 or row[0] not in [str(i) for i in range(1, 7)]:
                  continue
              if not all(re.fullmatch(r'\d+(?:\.\d+)?', x) for x in row[1:]):
                  continue
              boat = int(row[0])
              if boat in valid:
                  raise RuntimeError(f'Duplicate boat {boat}; no JSON saved.')
              valid[boat] = row
          if set(valid) != set(range(1, 7)):
              raise RuntimeError(f'Only {len(valid)} / 6 complete exhibition rows found; no JSON saved.')

          print('boat | weight | tilt | exhibition | lap | turn | straight')
          for boat in range(1, 7):
              print(' | '.join(valid[boat]))
          print('PASS: 6/6 complete exhibition rows detected.')
          print('HOLD: Race date unverified. JSON is intentionally not saved.')
          print('TEST ONLY: no files committed, no app data overwritten.')
          PY
