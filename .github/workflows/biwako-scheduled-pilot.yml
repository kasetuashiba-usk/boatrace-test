name: Biwako Scheduled Provisional Collector

on:
  schedule:
    # Every 10 minutes 09:01-16:51 JST; execution can be delayed.
    - cron: '1,11,21,31,41,51 0-7 * * *'
  workflow_dispatch:
    inputs:
      race:
        description: 'Race number 1-12 (run after exhibition data is published)'
        required: true
        default: '8'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository for provisional JSON publishing
        uses: actions/checkout@v4
      - name: Select race from today's official closing times
        id: select
        env:
          MANUAL_RACE: ${{ github.event.inputs.race }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.request
          from datetime import datetime, timezone, timedelta
          from html.parser import HTMLParser
          from pathlib import Path
          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)
          target = None
          if os.environ.get('EVENT_NAME') == 'workflow_dispatch':
              target = int(os.environ['MANUAL_RACE'])
              if not 1 <= target <= 12: raise ValueError('race must be 1..12')
              print('Manual test race:', target)
          else:
              # Official nationwide site supplies today's 12 planned closing times.
              date = now.strftime('%Y%m%d')
              url = f'https://www.boatrace.jp/owpc/pc/race/odds3t?hd={date}&jcd=11&rno=1'
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      html = response.read().decode('utf-8', errors='replace')
              except Exception as exc:
                  print('SKIP: cannot retrieve official schedule:', exc)
                  html = ''
              class Parser(HTMLParser):
                  def __init__(self):
                      super().__init__(); self.rows=[]; self.row=None; self.cell=None
                  def handle_starttag(self,t,a):
                      if t=='tr': self.row=[]
                      elif t in ('th','td') and self.row is not None: self.cell=[]
                  def handle_data(self,d):
                      if self.cell is not None: self.cell.append(d)
                  def handle_endtag(self,t):
                      if t in ('th','td') and self.cell is not None:
                          self.row.append(''.join(self.cell).strip()); self.cell=None
                      elif t=='tr' and self.row is not None:
                          self.rows.append(self.row); self.row=None
              parser=Parser(); parser.feed(html)
              time_rows=[r for r in parser.rows if r and '締切予定時刻' in r[0]]
              if len(time_rows) == 1:
                  entries = time_rows[0][1:]
                  if len(entries) == 12 and all(re.fullmatch(r'\d{1,2}:\d{2}',v) for v in entries):
                      candidates=[]
                      for race, hhmm in enumerate(entries,1):
                          h,m=map(int,hhmm.split(':'))
                          cutoff=now.replace(hour=h,minute=m,second=0,microsecond=0)
                          mins=(cutoff-now).total_seconds()/60
                          if 6 <= mins <= 16: candidates.append((race,round(mins,1)))
                      if candidates:
                          target=candidates[0][0]
                          print('Auto-selected race',target,'minutes to planned close',candidates[0][1])
                  else: print('SKIP: incomplete closing-time row',entries)
              else: print('SKIP: no unique official closing-time row')
              if target is not None:
                  # UI date is only a provisional guard; it is NOT record-level proof.
                  ui_url=f'https://www.boatrace-biwako.jp/sp/index.php?page=yosou-cyokuzen&race={target}'
                  try:
                      req=urllib.request.Request(ui_url,headers={'User-Agent':'Mozilla/5.0'})
                      with urllib.request.urlopen(req,timeout=20) as response:
                          ui=response.read().decode('utf-8', errors='replace')
                      months=re.findall(r'class=[\'\"]schedule-area__month[\'\"][^>]*>\s*(\d{1,2})\s*/',ui)
                      days=re.findall(r'<dd\b[^>]*class=[\'\"][^\'\"]*schedule-area__days\s+current[^\'\"]*[\'\"][^>]*>\s*<p\b[^>]*class=[\'\"]item-day[\'\"][^>]*>\s*(\d{1,2})\s*</p>',ui,re.I|re.S)
                      if len(set(months))!=1 or len(days)!=1 or (int(months[0]),int(days[0]))!=(now.month,now.day):
                          print('SKIP: Biwako current-day UI not confirmed')
                          target=None
                  except Exception as exc:
                      print('SKIP: Biwako current-day check failed:', exc)
                      target=None
          output=Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a') as fp: fp.write(f'race={target or ""}\n')
          if target:
              with Path(os.environ['GITHUB_ENV']).open('a') as fp: fp.write(f'TARGET_RACE={target}\n')
          else: print('SKIP: no eligible race right now; no JSON generated')
          PY
      - name: Extract six boats (retry if exhibition not yet published)
        if: ${{ steps.select.outputs.race != '' }}
        env:
          RACE: ${{ env.TARGET_RACE }}
        run: |
          cat > /tmp/biwako_complete.py <<'PY'
          import json, os, re, urllib.request
          from datetime import datetime, timezone, timedelta
          from html.parser import HTMLParser
          from pathlib import Path
          
          class Tables(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tables=[]; self.stack=[]; self.row=None; self.cell=None
              def handle_starttag(self,tag,attrs):
                  if tag=='table': self.stack.append([])
                  elif self.stack and tag=='tr': self.row=[]
                  elif self.stack and tag in ('td','th') and self.row is not None: self.cell=[]
              def handle_data(self,data):
                  if self.cell is not None: self.cell.append(data)
              def handle_endtag(self,tag):
                  if tag in ('td','th') and self.cell is not None and self.row is not None:
                      self.row.append(' '.join(''.join(self.cell).split())); self.cell=None
                  elif tag=='tr' and self.row is not None and self.stack:
                      self.stack[-1].append(self.row); self.row=None
                  elif tag=='table' and self.stack:
                      self.tables.append(self.stack.pop())
          
          race=int(os.environ['RACE'])
          if not 1<=race<=12: raise ValueError('Race must be 1..12')
          now=datetime.now(timezone(timedelta(hours=9)))
          url=f'https://www.boatrace-biwako.jp/sp/index.php?page=yosou-cyokuzen&race={race}'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; BoatraceResearch/1.0)'})
          with urllib.request.urlopen(req,timeout=25) as resp:
              raw=resp.read(); charset=resp.headers.get_content_charset() or 'utf-8'
          html=raw.decode(charset,errors='replace')
          parsed=Tables();parsed.feed(html)
          
          # UI date is only a provisional check, NOT an independent record timestamp.
          months=re.findall(r'class=[\'\"]schedule-area__month[\'\"][^>]*>\s*(\d{1,2})\s*/',html)
          days=re.findall(r'<dd\b[^>]*class=[\'\"][^\'\"]*schedule-area__days\s+current[^\'\"]*[\'\"][^>]*>\s*<p\b[^>]*class=[\'\"]item-day[\'\"][^>]*>\s*(\d{1,2})\s*</p>',html,re.I|re.S)
          if len(set(months))!=1 or len(days)!=1 or (int(months[0]),int(days[0]))!=(now.month,now.day):
              raise RuntimeError('Site highlighted date not unique/current; no JSON written')
          selected=re.search(r'<option\b(?=[^>]*\bselected\b)[^>]*>(.*?)</option>',html,re.I|re.S)
          if not selected or not re.search(rf'(?<!\d){race}\s*R(?!\d)',re.sub('<[^>]*>','',selected.group(1)),re.I):
              raise RuntimeError('Selected race mismatch; no JSON written')
          
          exhibit_tables=[t for t in parsed.tables if all(s in ' '.join(' '.join(r) for r in t[:5]) for s in ('一周','まわり足','直線'))]
          st_tables=[t for t in parsed.tables if any('今節平均ST' in ''.join(r) for r in t[:3]) and any('スタート順' in ''.join(r) for r in t[:3])]
          if len(exhibit_tables)!=1 or len(st_tables)!=1:
              raise RuntimeError(f'Unexpected table layout: exhibition={len(exhibit_tables)} ST={len(st_tables)}')
          
          exhibit={}
          for row in exhibit_tables[0]:
              if not row or row[0] not in tuple(map(str,range(1,7))): continue
              if len(row)<7 or not all(re.fullmatch(r'\d{1,3}\.\d{1,2}',x) for x in row[1:7]):
                  raise RuntimeError(f'Invalid exhibition row: {row!r}')
              boat=int(row[0])
              if boat in exhibit: raise RuntimeError(f'Duplicate exhibition boat {boat}')
              exhibit[boat]=dict(zip(('weight','tilt','exhibition','lap','turn','straight'),map(float,row[1:7])))
          
          starts={}
          table=st_tables[0]
          for i,row in enumerate(table):
              if len(row)<3 or row[0] not in tuple(map(str,range(1,7))) or row[1]!=row[0]: continue
              boat=int(row[0]); next_row=table[i+1] if i+1<len(table) else []
              if len(next_row)!=1 or not re.fullmatch(r'\d+(?:\.\d+)?',next_row[0]):
                  raise RuntimeError(f'Invalid start-order row for boat {boat}')
              if not re.fullmatch(r'\.\d{2}',row[2]) or not re.fullmatch(r'(?:F|L)?\.\d{2}',row[-1]):
                  raise RuntimeError(f'Invalid ST for boat {boat}')
              if boat in starts: raise RuntimeError(f'Duplicate ST boat {boat}')
              starts[boat]={'series_avg_st':float(row[2]),'series_avg_start_order':float(next_row[0]),'exhibition_st_raw':row[-1]}
          
          expected=set(range(1,7))
          if set(exhibit)!=expected or set(starts)!=expected:
              raise RuntimeError(f'Missing boats: exhibition={sorted(exhibit)} ST={sorted(starts)}; no JSON written')
          # Official entry/ranking pages are fetched separately; record dates still unverified.
          def fetch_tables(u):
              req2=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 (compatible; BoatraceResearch/1.0)'})
              with urllib.request.urlopen(req2,timeout=25) as resp2:
                  data2=resp2.read()
                  charset2=resp2.headers.get_content_charset() or 'utf-8'
              p2=Tables();p2.feed(data2.decode(charset2,errors='replace'))
              return p2.tables
          
          entry_url=f'https://www.boatrace-biwako.jp/sp/index.php?page=yosou-syussou&race={race}'
          ranking_url='https://www.boatrace-biwako.jp/sp/index.php?page=datafile-motorrank'
          et=fetch_tables(entry_url)
          rt=fetch_tables(ranking_url)
          motor_tables=[t for t in et if t and 'モーター' in ' '.join(t[0]) and 'ボート' in ' '.join(t[0])]
          if len(motor_tables)!=1: raise RuntimeError('Motor entry table not unique')
          motor_map={}
          for i,r in enumerate(motor_tables[0]):
              if not r or r[0] not in tuple(map(str,range(1,7))): continue
              if len(r)<4 or not re.fullmatch(r'\d{1,3}',r[2]):
                  raise RuntimeError(f'Invalid motor row: {r}')
              n=int(r[0]); next_r=motor_tables[0][i+1] if i+1<len(motor_tables[0]) else []
              if len(next_r)<2 or not all(re.fullmatch(r'\d{1,2}\.\d',x) for x in next_r[:2]):
                  raise RuntimeError(f'Invalid motor rate row for boat {n}: {next_r}')
              if n in motor_map: raise RuntimeError(f'Duplicate motor boat {n}')
              motor_map[n]={'motor_no':int(r[2]),'motor_2rate_entry_pct':float(next_r[0]),
                            'boat_no':int(r[3]),'boat_2rate_entry_pct':float(next_r[1])}
          if set(motor_map)!=expected or len({b['motor_no'] for b in motor_map.values()})!=6:
              raise RuntimeError('Incomplete or duplicate motor records')
          motor_ids={b['motor_no'] for b in motor_map.values()}
          rank_by_motor={}
          for t in rt:
              for r in t:
                  if len(r)<5 or not re.fullmatch(r'\d+',r[0]) or not re.fullmatch(r'\d+',r[2]): continue
                  m=int(r[2])
                  if m not in motor_ids: continue
                  if m in rank_by_motor: raise RuntimeError(f'Duplicate motor ranking: {m}')
                  rank_by_motor[m]={'rank_display_provisional':int(r[0]),'ranking_raw':r}
          if set(rank_by_motor)!=motor_ids:
              raise RuntimeError(f'Ranking missing motors: {sorted(motor_ids-set(rank_by_motor))}')
          for b in motor_map.values(): b['ranking_unverified']=rank_by_motor[b['motor_no']]
          
          payload={
              'venue':'biwako','race':race,'date_jst':now.date().isoformat(),
              'fetched_at_jst':now.isoformat(),'source_url':url,
              'source_entry_url':entry_url,'source_motor_ranking_url':ranking_url,
              'ranking_column_verification':'UNVERIFIED',
              'date_verification':'PROVISIONAL_SITE_HIGHLIGHT_ONLY',
              'production_approved':False,
              'boats':[{'boat':n,**exhibit[n],**starts[n],**motor_map[n]} for n in range(1,7)]
          }
          out=Path('test-output');out.mkdir(exist_ok=True)
          path=out/f'biwako-complete-{now:%Y%m%d}-{race:02d}R-provisional.json'
          path.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('PASS: exhibition + series ST + start order + exhibition ST + motor rates + ranking match, all 6 boats')
          print('JST fetched:',now.isoformat())
          print('JSON:',path)
          for b in payload['boats']: print('BOAT',b)
          print('PROVISIONAL: site-highlight date and ranking column meanings unverified; production_approved=false')
          PY
          for attempt in 1 2 3; do
            echo "Attempt $attempt/3: fetch exhibition and starts"
            if python3 /tmp/biwako_complete.py; then exit 0; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 45
          done
      - name: Fetch same race 120 trifecta odds
        if: ${{ steps.select.outputs.race != '' }}
        env:
          RACE: ${{ env.TARGET_RACE }}
        run: |
          export RACE_DATE="$(TZ=Asia/Tokyo date +%Y%m%d)"
          python3 - <<'PY'
          import json, os, re, urllib.request
          from datetime import datetime, timezone, timedelta
          from html.parser import HTMLParser
          from pathlib import Path
          
          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)
          race = int(os.environ['RACE'])
          day = os.environ['RACE_DATE']
          if not (1 <= race <= 12) or not re.fullmatch(r'\d{8}', day):
              raise ValueError('Invalid race or YYYYMMDD date')
          datetime.strptime(day, '%Y%m%d')
          url = f'https://www.boatrace.jp/owpc/pc/race/odds3t?hd={day}&jcd=11&rno={race}'
          
          class Tables(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tables = []
                  self.table = None
                  self.row = None
                  self.cell = None
              def handle_starttag(self, tag, attrs):
                  if tag == 'table':
                      self.table = []
                  elif tag == 'tr' and self.table is not None:
                      self.row = []
                  elif tag in ('td','th') and self.row is not None:
                      self.cell = []
              def handle_data(self, data):
                  if self.cell is not None:
                      self.cell.append(data)
              def handle_endtag(self, tag):
                  if tag in ('td','th') and self.cell is not None:
                      self.row.append(' '.join(''.join(self.cell).split()))
                      self.cell = None
                  elif tag == 'tr' and self.row is not None:
                      self.table.append(self.row)
                      self.row = None
                  elif tag == 'table' and self.table is not None:
                      self.tables.append(self.table)
                      self.table = None
          
          req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=25) as resp:
              raw = resp.read()
              charset = resp.headers.get_content_charset() or 'utf-8'
          html = raw.decode(charset, errors='replace')
          p = Tables(); p.feed(html)
          print('SOURCE:', url)
          print('FETCHED JST:', now.isoformat())
          print('HTML bytes:',len(raw),'tables:',len(p.tables))
          mt = re.search(r'オッズ更新時間\s*(\d{1,2}:\d{2})', re.sub(r'<[^>]*>', ' ',html))
          odds_update_hhmm = mt.group(1) if mt else None
          print('ODDS UPDATE TIME (site text):', odds_update_hhmm)
          
          # Official HTML is a 6-column layout: each column has one first-place boat,
          # five second-place sections, four third-place/odds rows per section.
          candidates = [t for t in p.tables if len(t) == 21 and len(t[0]) >= 12]
          if len(candidates) != 1:
              raise RuntimeError(f'Expected exactly one 21-row odds table, got {len(candidates)}. Not saving.')
          table = candidates[0]
          header = table[0]
          firsts = []
          for col in range(6):
              i = 2*col
              if i >= len(header):
                  raise RuntimeError('Unexpected header layout; no JSON saved')
              first = header[i].strip()
              if first not in '123456' or len(first) != 1:
                  raise RuntimeError('Unexpected first-place boat header; no JSON saved')
              firsts.append(int(first))
          if sorted(firsts) != list(range(1,7)):
              raise RuntimeError('First-place boat headers are not 1..6; no JSON saved')
          
          odds = {}
          unavailable = []
          for col, first in enumerate(firsts):
              for section in range(5):
                  second = None
                  for offset in range(4):
                      row_index = 1 + section*4 + offset
                      row = table[row_index]
                      # First row of each group: second / third / odds for every column (18 cells).
                      # Following rows: third / odds for every column (12 cells).
                      start = col * (3 if offset == 0 else 2)
                      expected = 18 if offset == 0 else 12
                      if len(row) != expected:
                          raise RuntimeError(f'Unexpected row {row_index}: {len(row)} cells, expected {expected}; no JSON saved')
                      fields = row[start:start + (3 if offset == 0 else 2)]
                      if offset == 0:
                          second_text, third_text, value_text = fields
                          if second_text not in '123456' or len(second_text) != 1:
                              raise RuntimeError(f'Bad second-place boat in row {row_index}')
                          second = int(second_text)
                      else:
                          third_text, value_text = fields
                      if third_text not in '123456' or len(third_text) != 1:
                          raise RuntimeError(f'Bad third-place boat in row {row_index}')
                      third = int(third_text)
                      if len({first,second,third}) != 3:
                          raise RuntimeError(f'Duplicate boat in {first}-{second}-{third}')
                      key = f'{first}-{second}-{third}'
                      if key in odds or key in unavailable:
                          raise RuntimeError(f'Duplicate combination: {key}')
                      value_text = value_text.replace(',','').strip()
                      if re.fullmatch(r'\d+(?:\.\d+)?', value_text):
                          value = float(value_text)
                          if value <= 0:
                              raise RuntimeError(f'Non-positive odds: {key}')
                          odds[key] = value
                      elif value_text in ('-', '－', '—', '欠場', '発売なし', ''):
                          unavailable.append(key)
                      else:
                          raise RuntimeError(f'Unexpected odds value for {key}: {value_text!r}')
          all_combinations = {f'{a}-{b}-{c}' for a in range(1,7) for b in range(1,7) for c in range(1,7) if len({a,b,c}) == 3}
          if set(odds).union(unavailable) != all_combinations:
              missing = sorted(all_combinations - set(odds) - set(unavailable))
              raise RuntimeError(f'Expected 120 combinations; missing: {missing[:12]}')
          print('PASS: 120/120 unique combinations mapped; numeric:',len(odds),'unavailable:',len(unavailable))
          print('SAMPLE:', dict(list(sorted(odds.items()))[:12]))
          if unavailable: print('UNAVAILABLE EXAMPLES:', unavailable[:12])
          # Deliberately unapproved: odds freshness, site date, and live-before-close
          # status are not independently verified by this parser.
          output = {
              'venue':'biwako','venue_code':'11','race':race,
              'requested_date_jst':f'{day[:4]}-{day[4:6]}-{day[6:]}',
              'fetched_at_jst':now.isoformat(),
              'odds_update_hhmm_site':odds_update_hhmm,
              'source_url':url,
              'bet_type':'trifecta',
              'odds':odds,
              'unavailable_combinations':sorted(unavailable),
              'date_verified':False,
              'pre_close_verified':False,
              'production_approved':False,
          }
          Path('test-output').mkdir(exist_ok=True)
          path = Path('test-output')/f'biwako-odds-{day}-{race:02}R-provisional.json'
          path.write_text(json.dumps(output,ensure_ascii=False,indent=2),encoding='utf-8')
          print('PROVISIONAL JSON:',path)
          print('DO NOT USE IN PRODUCTION: exact record date and pre-close status unverified')
          PY
      - name: Validate and merge provisional JSON
        if: ${{ steps.select.outputs.race != '' }}
        env:
          RACE: ${{ env.TARGET_RACE }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          
          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)
          race = int(os.environ['RACE'])
          day = now.strftime('%Y%m%d')
          folder = Path('test-output')
          a = folder / f'biwako-complete-{day}-{race:02d}R-provisional.json'
          b = folder / f'biwako-odds-{day}-{race:02d}R-provisional.json'
          complete = json.loads(a.read_text(encoding='utf-8'))
          odds = json.loads(b.read_text(encoding='utf-8'))
          assert complete['venue'] == odds['venue'] == 'biwako'
          assert complete['race'] == odds['race'] == race
          assert complete['date_jst'] == odds['requested_date_jst'] == now.date().isoformat()
          assert complete['production_approved'] is False and odds['production_approved'] is False
          assert len(complete['boats']) == 6
          assert {x['boat'] for x in complete['boats']} == set(range(1,7))
          expected = {f'{x}-{y}-{z}' for x in range(1,7) for y in range(1,7) for z in range(1,7) if len({x,y,z}) == 3}
          assert set(odds['odds']) | set(odds['unavailable_combinations']) == expected
          assert not (set(odds['odds']) & set(odds['unavailable_combinations']))
          t1 = datetime.fromisoformat(complete['fetched_at_jst'])
          t2 = datetime.fromisoformat(odds['fetched_at_jst'])
          gap = abs((t1-t2).total_seconds())
          if gap > 600:
              raise RuntimeError(f'Source fetches are {gap:.0f}s apart; refusing to combine snapshots')
          
          merged = {
              'venue': 'biwako',
              'venue_code': '11',
              'race': race,
              'date_jst': complete['date_jst'],
              'fetched_at_jst': now.isoformat(),
              'source_complete': complete,
              'source_odds': odds,
              'boats': complete['boats'],
              'odds_3t': odds['odds'],
              'unavailable_combinations': odds['unavailable_combinations'],
              'odds_update_hhmm_site': odds.get('odds_update_hhmm_site'),
              'source_fetch_gap_seconds': round(gap,1),
              'date_verification': 'PROVISIONAL_SITE_HIGHLIGHT_ONLY',
              'odds_pre_close_verified': False,
              'motor_ranking_columns_verified': False,
              'production_approved': False,
          }
          path = folder / f'biwako-auto-{day}-{race:02d}R-provisional.json'
          path.write_text(json.dumps(merged, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print('PASS: 6 boats and 120 trifecta combinations joined, same venue/date/race')
          print('Fetch gap:',round(gap,1),'seconds')
          print('Output:',path)
          print('SAFETY: production_approved=false; no repository changes; no predictions generated')
          PY
      - name: Upload combined JSON (test only)
        if: ${{ steps.select.outputs.race != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: biwako-auto-provisional-${{ github.run_id }}
          path: test-output/biwako-auto-*-provisional.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish provisional snapshot for v13 (public, not prediction-approved)
        if: ${{ steps.select.outputs.race != '' }}
        env:
          RACE: ${{ env.TARGET_RACE }}
        run: |
          python3 - <<'PY'
          import json, os, shutil
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          now = datetime.now(timezone(timedelta(hours=9)))
          race = int(os.environ['RACE'])
          day = now.strftime('%Y%m%d')
          src = Path(f'test-output/biwako-auto-{day}-{race:02d}R-provisional.json')
          data = json.loads(src.read_text(encoding='utf-8'))
          if (data.get('venue') != 'biwako' or data.get('race') != race
              or data.get('date_jst') != now.date().isoformat()
              or data.get('production_approved') is not False
              or len(data.get('boats', [])) != 6
              or len(data.get('odds_3t', {})) + len(data.get('unavailable_combinations', [])) != 120):
              raise RuntimeError('Provisional data validation failed, not publishing')
          dest = Path(f'data/live/biwako-{day}-{race:02d}R.json')
          dest.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(src, dest)
          print('Prepared PUBLIC provisional file:', dest)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live/
          if git diff --cached --quiet; then
            echo 'No changes to publish'
            exit 0
          fi
          git commit -m "Publish provisional Biwako data (NOT production-approved)"
          # Rebase against concurrent updates, but never silently drop errors.
          git pull --rebase origin main
          git push origin HEAD:main
