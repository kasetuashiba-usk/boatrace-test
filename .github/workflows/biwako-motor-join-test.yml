name: Biwako Motor Join Test

on:
  workflow_dispatch:
    inputs:
      race:
        description: 'Race number (1-12)'
        required: true
        default: '3'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Join motor numbers and official ranking (provisional)
        env:
          RACE: ${{ inputs.race }}
        run: |
          python3 - <<'PY'
          import os, re, json, urllib.request
          from html.parser import HTMLParser
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)
          race = int(os.environ['RACE'])
          if not 1 <= race <= 12:
              raise ValueError('race must be 1..12')

          class Tables(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tables, self.stack, self.row, self.cell = [], [], None, None
              def handle_starttag(self, tag, attrs):
                  if tag == 'table': self.stack.append([])
                  elif self.stack and tag == 'tr': self.row = []
                  elif self.stack and tag in ('td', 'th') and self.row is not None: self.cell = []
              def handle_data(self, data):
                  if self.cell is not None: self.cell.append(data)
              def handle_endtag(self, tag):
                  if tag in ('td', 'th') and self.cell is not None and self.row is not None:
                      self.row.append(' '.join(''.join(self.cell).split()))
                      self.cell = None
                  elif tag == 'tr' and self.row is not None and self.stack:
                      self.stack[-1].append(self.row)
                      self.row = None
                  elif tag == 'table' and self.stack:
                      self.tables.append(self.stack.pop())

          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (compatible; BoatraceResearch/1.0)'})
              with urllib.request.urlopen(req, timeout=25) as resp:
                  data = resp.read()
                  charset = resp.headers.get_content_charset() or 'utf-8'
              parser = Tables()
              parser.feed(data.decode(charset, errors='replace'))
              print('FETCH:', url, 'bytes:', len(data), 'tables:', len(parser.tables))
              return parser.tables

          base = 'https://www.boatrace-biwako.jp/sp/index.php?page='
          entry_url = base + f'yosou-syussou&race={race}'
          rank_url = base + 'datafile-motorrank'
          entry_tables = fetch(entry_url)
          rank_tables = fetch(rank_url)

          # 出走表: 見出しからテーブルを特定。番号行と次の2連対率行が交互に出現。
          entry_candidates = [t for t in entry_tables if t and 'モーター' in ' '.join(t[0]) and 'ボート' in ' '.join(t[0])]
          if len(entry_candidates) != 1:
              raise RuntimeError(f'Motor entry table count was {len(entry_candidates)} (expected 1)')
          entry = entry_candidates[0]
          boats = {}
          for i, row in enumerate(entry):
              if not row or row[0] not in tuple(map(str, range(1, 7))):
                  continue
              if len(row) < 4 or not re.fullmatch(r'\d{1,3}', row[2]):
                  raise RuntimeError(f'Invalid boat/motor row: {row}')
              boat = int(row[0]); motor = int(row[2]); boat_no = row[3]
              if boat in boats or i + 1 >= len(entry):
                  raise RuntimeError(f'Duplicate boat or missing percentage for boat {boat}')
              subrow = entry[i+1]
              if len(subrow) < 2 or not all(re.fullmatch(r'\d{1,2}\.\d', x) for x in subrow[:2]):
                  raise RuntimeError(f'Invalid rate row after boat {boat}: {subrow}')
              boats[boat] = {'boat': boat, 'motor_no': motor, 'motor_2rate_entry_pct': float(subrow[0]),
                             'boat_no': int(boat_no) if boat_no.isdigit() else boat_no,
                             'boat_2rate_entry_pct': float(subrow[1])}
          if sorted(boats) != [1,2,3,4,5,6] or len({x['motor_no'] for x in boats.values()}) != 6:
              raise RuntimeError('Incomplete or duplicated boat/motor mapping')

          # ランキングはページ内にある行だけを照合。
          # 列意味・集計期間は今後の公式ヘッダー確認まで暫定扱い。
          found = {}
          for table in rank_tables:
              for row in table:
                  if len(row) < 5 or not re.fullmatch(r'\d+', row[0]) or not re.fullmatch(r'\d+', row[2]):
                      continue
                  motor = int(row[2])
                  if motor in {x['motor_no'] for x in boats.values()}:
                      if motor in found:
                          raise RuntimeError(f'Duplicate motor ranking rows: {motor}')
                      found[motor] = {'rank_display': int(row[0]), 'ranking_raw': row}
          for boat in boats.values():
              match = found.get(boat['motor_no'])
              boat['ranking'] = match
              print('BOAT:', json.dumps(boat, ensure_ascii=False))
          print('MOTOR RANKINGS MATCHED:', len(found), '/ 6')
          if len(found) != 6:
              print('NOTICE: Some motors not found on ranking page. Do not treat missing as zero.')
          # 出走表からの数値だけを確定的な項目として記録。日付・ランキング列は暫定。
          payload = {
              'venue':'biwako', 'race':race, 'date_jst_provisional':now.date().isoformat(),
              'fetched_at_jst':now.isoformat(),
              'source_entry_url':entry_url, 'source_motor_ranking_url':rank_url,
              'date_verification':'UNVERIFIED', 'ranking_column_verification':'UNVERIFIED',
              'production_approved':False,
              'boats':[boats[i] for i in range(1,7)]
          }
          out = Path('test-output') / f'biwako-motor-{now:%Y%m%d}-{race:02d}R-provisional.json'
          out.parent.mkdir(exist_ok=True)
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
          print('PASS: 6 boats with motor No. and entry-page motor 2-rate parsed.')
          print('PROVISIONAL JSON:', out)
          print('DO NOT USE IN PRODUCTION: date and ranking columns not independently verified.')
          PY
      - name: Upload provisional motor JSON
        uses: actions/upload-artifact@v4
        with:
          name: biwako-motor-provisional
          path: test-output/*.json
          if-no-files-found: error
          retention-days: 7
