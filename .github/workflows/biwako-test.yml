name: Biwako Official Data Test

on:
  workflow_dispatch:
    inputs:
      race:
        description: 'Race number (1-12)'
        required: true
        default: '3'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate and create provisional JSON
        env:
          RACE: ${{ inputs.race }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          from datetime import datetime, timezone, timedelta
          from html.parser import HTMLParser
          from pathlib import Path

          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)
          race = int(os.environ['RACE'])
          if race not in range(1, 13):
              raise ValueError('race must be 1..12')

          class Tables(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tables, self.stack, self.row, self.cell = [], [], None, None
              def handle_starttag(self, tag, attrs):
                  if tag == 'table': self.stack.append([])
                  elif self.stack and tag == 'tr': self.row = []
                  elif self.stack and tag in ('td', 'th') and self.row is not None: self.cell = []
              def handle_data(self, data):
                  if self.cell is not None: self.cell.append(data)
              def handle_endtag(self, tag):
                  if tag in ('td', 'th') and self.cell is not None and self.row is not None:
                      self.row.append(' '.join(''.join(self.cell).split()))
                      self.cell = None
                  elif tag == 'tr' and self.row is not None and self.stack:
                      self.stack[-1].append(self.row)
                      self.row = None
                  elif tag == 'table' and self.stack:
                      self.tables.append(self.stack.pop())

          url = f'https://www.boatrace-biwako.jp/sp/index.php?page=yosou-cyokuzen&race={race}'
          req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 (compatible; BoatraceResearch/1.0)'})
          with urllib.request.urlopen(req, timeout=25) as response:
              raw = response.read()
              charset = response.headers.get_content_charset() or 'utf-8'
          html = raw.decode(charset, errors='replace')
          tables = Tables()
          tables.feed(html)
          print('Fetched JST:', now.isoformat())
          print('Source:', url)
          print('HTML bytes:', len(raw))

          # This is the site's *highlighted calendar date*, not an independent timestamp on the results.
          months = re.findall(r'class=[\'\"]schedule-area__month[\'\"][^>]*>\s*(\d{1,2})\s*/', html)
          highlighted = re.findall(
              r'<dd\b[^>]*class=[\'\"][^\'\"]*schedule-area__days\s+current[^\'\"]*[\'\"][^>]*>\s*<p\b[^>]*class=[\'\"]item-day[\'\"][^>]*>\s*(\d{1,2})\s*</p>',
              html, re.I | re.S)
          print('Schedule months:', months)
          print('Highlighted days:', highlighted)
          if len(set(months)) != 1 or len(highlighted) != 1:
              raise RuntimeError('Cannot uniquely establish displayed month/day; no JSON generated')
          if (int(months[0]), int(highlighted[0])) != (now.month, now.day):
              raise RuntimeError('Displayed site date does not match JST today; no JSON generated')

          # Confirm the race selector actually selects the requested race.
          selected = re.search(r'<option\b(?=[^>]*\bselected\b)[^>]*>(.*?)</option>', html, re.I | re.S)
          if not selected or not re.search(rf'(?<!\d){race}\s*R(?!\d)', re.sub('<[^>]*>', '', selected.group(1)), re.I):
              raise RuntimeError('Requested race is not selected in page; no JSON generated')

          candidates = []
          for tab in tables.tables:
              heading = ' '.join(' '.join(row) for row in tab[:5])
              if all(x in heading for x in ('一周', 'まわり足', '直線')):
                  candidates.append(tab)
          if len(candidates) != 1:
              raise RuntimeError(f'Expected one exhibition table, found {len(candidates)}')
          rows = candidates[0]
          data = {}
          number = re.compile(r'^\d{1,3}\.\d{1,2}$')
          for row in rows:
              if not row or row[0] not in [str(i) for i in range(1,7)]:
                  continue
              if len(row) < 7 or not all(number.fullmatch(x) for x in row[1:7]):
                  raise RuntimeError(f'Invalid row: {row}')
              boat = int(row[0])
              if boat in data: raise RuntimeError(f'Duplicate boat {boat}')
              data[boat] = dict(zip(('weight','tilt','exhibition','lap','turn','straight'), map(float, row[1:7])))
          if sorted(data) != list(range(1,7)):
              raise RuntimeError(f'Only {len(data)}/6 complete boat rows')

          payload = {
              'venue': 'biwako', 'race': race,
              'date_jst': now.date().isoformat(),
              'fetched_at_jst': now.isoformat(),
              'source_url': url,
              'date_verification': 'PROVISIONAL_SITE_HIGHLIGHT_ONLY',
              'production_approved': False,
              'boats': [{'boat': k, **data[k]} for k in sorted(data)]
          }
          out = Path('test-output')
          out.mkdir(exist_ok=True)
          path = out / f'biwako-{now:%Y%m%d}-{race:02d}R-provisional.json'
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
          print('PASS: six boats, selected race, and highlighted day match JST today')
          print('JSON:', path)
          print('CAUTION: Date is still provisional, not record-level verified; DO NOT USE IN PRODUCTION')
          for item in payload['boats']:
              print('BOAT', item)
          PY
      - name: Upload provisional JSON as test artifact only
        uses: actions/upload-artifact@v4
        with:
          name: biwako-provisional-json
          path: test-output/*.json
          retention-days: 1
