name: Biwako Odds Diagnostic

on:
  workflow_dispatch:
    inputs:
      race:
        description: 'Race number (1-12)'
        required: true
        default: '3'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect official odds page (read only)
        env:
          RACE: ${{ inputs.race }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.request
          from html.parser import HTMLParser
          from datetime import datetime, timezone, timedelta

          class Inspect(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tables=[];self.table_depth=0;self.rows=None;self.row=None;self.cell=None
                  self.links=[];self.a_href=None;self.a_text=None
                  self.forms=[];self.inputs=[];self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='table':
                      if self.table_depth==0:self.rows=[]
                      self.table_depth+=1
                  elif tag=='tr' and self.table_depth==1:self.row=[]
                  elif tag in ('td','th') and self.table_depth==1 and self.row is not None:self.cell=[]
                  elif tag=='a':self.a_href=a.get('href','');self.a_text=[]
                  elif tag=='form':self.forms.append(a)
                  elif tag in ('input','select','option'):self.inputs.append((tag,a))
                  elif tag=='script' and a.get('src'):self.scripts.append(a['src'])
              def handle_data(self,data):
                  if self.cell is not None:self.cell.append(data)
                  if self.a_text is not None:self.a_text.append(data)
              def handle_endtag(self,tag):
                  if tag in ('td','th') and self.cell is not None and self.row is not None:
                      self.row.append(' '.join(''.join(self.cell).split()));self.cell=None
                  elif tag=='tr' and self.row is not None and self.table_depth==1:
                      self.rows.append(self.row);self.row=None
                  elif tag=='table' and self.table_depth:
                      self.table_depth-=1
                      if self.table_depth==0:self.tables.append(self.rows)
                  elif tag=='a' and self.a_text is not None:
                      self.links.append((' '.join(''.join(self.a_text).split()),self.a_href))
                      self.a_text=None;self.a_href=None

          race=int(os.environ['RACE'])
          if race not in range(1,13):raise ValueError('Race must be 1..12')
          url=f'https://www.boatrace-biwako.jp/sp/index.php?page=yosou-odds&race={race}'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; BoatraceResearch/1.0)','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=25) as r:
              raw=r.read();charset=r.headers.get_content_charset() or 'utf-8'
          html=raw.decode(charset,errors='replace')
          p=Inspect();p.feed(html)
          print('Fetched JST:',datetime.now(timezone(timedelta(hours=9))).isoformat())
          print('Source:',url,'bytes:',len(raw),'tables:',len(p.tables))
          print('TITLE:',re.search(r'<title[^>]*>(.*?)</title>',html,re.S|re.I).group(1).strip() if re.search(r'<title[^>]*>(.*?)</title>',html,re.S|re.I) else 'UNKNOWN')
          print('FORMS:',p.forms[:8]);print('FORM INPUTS:',p.inputs[:35])
          print('ODDS / BETTING LINKS:')
          for text,href in p.links:
              if any(k in text+href for k in ('オッズ','3連','３連','三連','2連','２連','単勝','yosou-odds')):
                  print('LINK:',repr(text),repr(href))
          print('TABLES (up to 12 rows each):')
          for i,rows in enumerate(p.tables):
              print('TABLE',i,'ROWS',len(rows))
              for row in rows[:12]:print('ROW:',repr(row[:20]))
          print('SCRIPT SOURCES:',p.scripts[:20])
          print('TRIFECTA TEXT COUNTS:',{k:html.count(k) for k in ['3連単','３連単','三連単','オッズ']})
          print('DIAGNOSTIC ONLY: no odds JSON saved, no repository files changed.')
          PY
